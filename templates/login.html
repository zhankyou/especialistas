<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · Sistema APS ESE 2026</title>

    <!-- Dependencias Universales -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/custom_alerts.css">
    <script src="/static/js/custom_alerts.js"></script>

    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <!-- Lado Izquierdo: Branding Corporativo -->
        <div class="login-brand">
            <div class="brand-logos">
                <img src="/static/img/logo-aps.png" alt="Logo APS">
                <img src="/static/img/logo-ese.png" alt="Logo ESE">
            </div>

            <div class="brand-text">
                <h1>Sistema de<br>Información APS</h1>
                <p>Plataforma integral para la recolección, gestión y auditoría de expedientes clínicos en campo.</p>
            </div>

            <div class="brand-footer">

            </div>
        </div>

        <!-- Lado Derecho: Formulario Autenticación -->
        <div class="login-form-container">
            <div class="form-header">
                <h2>Bienvenido</h2>
                <p>Ingrese sus credenciales</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-icon-wrapper">
                        <input type="email" id="email" class="modern-input" name="email" required placeholder="ejemplo@entidad.gov.co" autocomplete="email">
                        <i class="fas fa-envelope leading-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="password" class="modern-input" name="password" required placeholder="••••••••" style="padding-right: 50px;" autocomplete="current-password">
                        <i class="fas fa-key leading-icon"></i>
                        <button type="button" id="toggle-password" class="toggle-pwd-btn" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Iniciar Sesión <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Script Principal de Lógica IAM -->
    <script src="/static/js/login.js"></script>
</body>
</html>
